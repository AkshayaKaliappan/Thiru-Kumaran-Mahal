services:
  - type: web
    name: thiru-kumaran-mahal-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py create_dev_admin"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: thiru-kumaran-mahal-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"

databases:
  - name: thiru-kumaran-mahal-db
    databaseName: thiru_kumaran_mahal
    user: root
